<!DOCTYPE html>
<html>
<head>
    <title>Test Recording Playback</title>
</head>
<body>
    <h1>Test Recording Playback</h1>
    <video id="testVideo" controls width="800" height="600">
        <source src="http://localhost:8002/api/v1/recordings/stream/camera_camera_946701d3_20250802_074425_600.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    
    <div id="status"></div>
    
    <script>
        const video = document.getElementById('testVideo');
        const status = document.getElementById('status');
        
        video.addEventListener('loadstart', () => {
            status.innerHTML += '<p>✅ Load started</p>';
        });
        
        video.addEventListener('loadedmetadata', () => {
            status.innerHTML += '<p>✅ Metadata loaded</p>';
        });
        
        video.addEventListener('loadeddata', () => {
            status.innerHTML += '<p>✅ Data loaded</p>';
        });
        
        video.addEventListener('canplay', () => {
            status.innerHTML += '<p>✅ Can play</p>';
        });
        
        video.addEventListener('error', (e) => {
            status.innerHTML += '<p>❌ Error: ' + (video.error ? video.error.message : 'Unknown error') + '</p>';
            console.error('Video error:', e, video.error);
        });
        
        // Test fetch
        fetch('http://localhost:8002/api/v1/recordings/stream/camera_camera_946701d3_20250802_074425_600.mp4', {
            method: 'HEAD'
        }).then(response => {
            status.innerHTML += '<p>✅ Fetch test: ' + response.status + ' ' + response.statusText + '</p>';
            status.innerHTML += '<p>Headers: ' + JSON.stringify(Object.fromEntries(response.headers)) + '</p>';
        }).catch(err => {
            status.innerHTML += '<p>❌ Fetch error: ' + err.message + '</p>';
        });
    </script>
</body>
</html>
