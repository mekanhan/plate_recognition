<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Camera Modal</title>
    <link rel="stylesheet" href="/static/css/ip_camera_modal.css">
    <script src="/static/js/ip_camera_modal.js"></script>
</head>
<body>
    <!-- IP Camera Modal -->
    <div class="modal-overlay" id="ipCameraModal">
        <div class="modal-container" role="dialog" aria-labelledby="modal-title" aria-describedby="modal-description">
            <!-- Modal Header -->
            <div class="modal-header">
                <h2 id="modal-title" class="modal-title">Add IP Camera</h2>
                <button class="close-button" aria-label="Close modal" onclick="closeModal()">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <p id="modal-description" class="helper-text" style="margin-top: 0;">
                    Configure your IP camera connection settings below.
                </p>

                <form id="cameraForm">
                    <!-- Auto-Discovery Section -->
                    <div class="discovery-section">
                        <label class="form-label">Auto-Discovery</label>
                        <p class="helper-text">Automatically discover cameras on your network</p>
                        <button type="button" class="discovery-button" id="discoverBtn" onclick="discoverCameras()">
                            <span id="discoverText">Discover Cameras</span>
                            <span class="spinner" id="discoverSpinner" style="display: none;"></span>
                        </button>
                        
                        <div class="discovered-cameras" id="discoveredCameras">
                            <!-- Discovered cameras will be populated here -->
                        </div>
                    </div>

                    <!-- Camera Name -->
                    <div class="form-group">
                        <label for="cameraName" class="form-label required">Camera Name</label>
                        <input type="text" id="cameraName" class="form-input" placeholder="e.g., Front Gate Camera" required>
                        <div class="error-text" id="cameraNameError"></div>
                    </div>

                    <!-- IP Address and Port -->
                    <div class="form-group">
                        <label for="ipAddress" class="form-label required">IP Address and Port</label>
                        <div class="input-group">
                            <input type="text" id="ipAddress" class="form-input" placeholder="192.168.1.100" required pattern="^(\d{1,3}\.){3}\d{1,3}$">
                            <input type="number" id="port" class="form-input port-input" placeholder="554" min="1" max="65535" value="554">
                        </div>
                        <div class="error-text" id="ipAddressError"></div>
                    </div>

                    <!-- Connection Type -->
                    <div class="form-group">
                        <label for="connectionType" class="form-label">Connection Type</label>
                        <select id="connectionType" class="form-select" onchange="updateDefaultPort()">
                            <option value="rtsp">RTSP (Recommended)</option>
                            <option value="http">HTTP</option>
                            <option value="https">HTTPS</option>
                            <option value="onvif">ONVIF</option>
                        </select>
                    </div>

                    <!-- Stream Path -->
                    <div class="form-group">
                        <label for="streamPath" class="form-label">Stream Path</label>
                        <input type="text" id="streamPath" class="form-input" placeholder="/stream" list="streamPathSuggestions">
                        <datalist id="streamPathSuggestions">
                            <option value="/stream">
                            <option value="/live">
                            <option value="/h264Preview_01_main">
                            <option value="/Streaming/Channels/101">
                            <option value="/cam/realmonitor?channel=1&subtype=0">
                        </datalist>
                        <div class="helper-text">Leave empty for auto-detection</div>
                    </div>

                    <!-- Location -->
                    <div class="form-group">
                        <label for="location" class="form-label required">Location</label>
                        <select id="location" class="form-select" required>
                            <option value="">Select Location</option>
                            <option value="main_entrance">Main Entrance</option>
                            <option value="parking_lot">Parking Lot</option>
                            <option value="exit_gate">Exit Gate</option>
                            <option value="loading_dock">Loading Dock</option>
                        </select>
                        <div class="error-text" id="locationError"></div>
                    </div>

                    <!-- Authentication -->
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" class="form-input" placeholder="admin" value="admin">
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="Enter camera password">
                    </div>

                    <!-- Test Connection -->
                    <div class="form-group">
                        <button type="button" class="test-button" id="testBtn" onclick="testConnection()">
                            <span id="testText">Test Connection</span>
                            <span class="spinner" id="testSpinner" style="display: none;"></span>
                        </button>
                        
                        <div class="connection-status" id="connectionStatus">
                            <!-- Status will be populated here -->
                        </div>
                    </div>
                </form>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveBtn" onclick="saveCamera()" disabled>Add Camera</button>
            </div>
        </div>
    </div>

    <script>
        // Simplified IP Camera Modal for standalone use
        class IPCameraModal {
            constructor() {
                this.isTestingConnection = false;
                this.isDiscovering = false;
                this.connectionTest = null;
                this.discoveredCameras = [];
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.initializeDefaults();
                this.showModal();
            }

            setupEventListeners() {
                // Form validation
                ['cameraName', 'ipAddress', 'location'].forEach(id => {
                    const element = document.getElementById(id);
                    if (element) {
                        element.addEventListener('input', () => this.validateForm());
                    }
                });

                // IP validation
                const ipInput = document.getElementById('ipAddress');
                if (ipInput) {
                    ipInput.addEventListener('input', () => this.validateIPAddress());
                }

                // Connection type change
                const connectionType = document.getElementById('connectionType');
                if (connectionType) {
                    connectionType.addEventListener('change', () => this.updateDefaultPort());
                }

                // Keyboard navigation
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.closeModal();
                    }
                });
            }

            initializeDefaults() {
                document.getElementById('port').value = '554';
                document.getElementById('username').value = 'admin';
                document.getElementById('connectionType').value = 'rtsp';
            }

            validateIPAddress() {
                const ipInput = document.getElementById('ipAddress');
                const errorDiv = document.getElementById('ipAddressError');
                const ip = ipInput.value.trim();

                if (!ip) {
                    ipInput.classList.remove('error', 'success');
                    errorDiv.textContent = '';
                    this.validateForm();
                    return;
                }

                const ipPattern = /^(\d{1,3}\.){3}\d{1,3}$/;
                if (!ipPattern.test(ip)) {
                    ipInput.classList.add('error');
                    ipInput.classList.remove('success');
                    errorDiv.textContent = 'Please enter a valid IP address';
                    errorDiv.style.display = 'block';
                    return;
                }

                const octets = ip.split('.');
                const isValidRange = octets.every(octet => {
                    const num = parseInt(octet, 10);
                    return num >= 0 && num <= 255;
                });

                if (!isValidRange) {
                    ipInput.classList.add('error');
                    ipInput.classList.remove('success');
                    errorDiv.textContent = 'IP address octets must be between 0 and 255';
                    errorDiv.style.display = 'block';
                    return;
                }

                ipInput.classList.remove('error');
                ipInput.classList.add('success');
                errorDiv.textContent = '';
                errorDiv.style.display = 'none';
                this.validateForm();
            }

            updateDefaultPort() {
                const connectionType = document.getElementById('connectionType').value;
                const portInput = document.getElementById('port');

                const defaultPorts = {
                    rtsp: 554,
                    http: 80,
                    https: 443,
                    onvif: 80
                };

                portInput.value = defaultPorts[connectionType] || 554;
            }

            validateForm() {
                const name = document.getElementById('cameraName').value.trim();
                const ip = document.getElementById('ipAddress').value.trim();
                const location = document.getElementById('location').value;
                const saveBtn = document.getElementById('saveBtn');

                const isValid = name && this.isValidIP(ip) && location;
                saveBtn.disabled = !isValid;

                return isValid;
            }

            isValidIP(ip) {
                const ipPattern = /^(\d{1,3}\.){3}\d{1,3}$/;
                if (!ipPattern.test(ip)) return false;

                const octets = ip.split('.');
                return octets.every(octet => {
                    const num = parseInt(octet, 10);
                    return num >= 0 && num <= 255;
                });
            }

            async discoverCameras() {
                if (this.isDiscovering) return;

                this.isDiscovering = true;
                this.updateDiscoveryUI(true);

                try {
                    // Simulate discovery for demo
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    
                    const mockCameras = [
                        {
                            ip_address: '192.168.1.100',
                            manufacturer: 'Reolink',
                            protocols: ['RTSP', 'HTTP'],
                            confidence: 0.95
                        },
                        {
                            ip_address: '192.168.1.101',
                            manufacturer: 'Hikvision',
                            protocols: ['RTSP', 'ONVIF'],
                            confidence: 0.88
                        }
                    ];

                    this.displayDiscoveredCameras(mockCameras);
                } catch (error) {
                    console.error('Discovery error:', error);
                    this.showStatus('error', 'Camera discovery failed. Please check your network connection.');
                } finally {
                    this.isDiscovering = false;
                    this.updateDiscoveryUI(false);
                }
            }

            updateDiscoveryUI(isDiscovering) {
                const discoverBtn = document.getElementById('discoverBtn');
                const discoverText = document.getElementById('discoverText');
                const discoverSpinner = document.getElementById('discoverSpinner');

                if (isDiscovering) {
                    discoverBtn.disabled = true;
                    discoverText.textContent = 'Discovering...';
                    discoverSpinner.style.display = 'inline-block';
                } else {
                    discoverBtn.disabled = false;
                    discoverText.textContent = 'Discover Cameras';
                    discoverSpinner.style.display = 'none';
                }
            }

            displayDiscoveredCameras(cameras) {
                const container = document.getElementById('discoveredCameras');
                
                if (cameras.length === 0) {
                    container.innerHTML = '<p class="helper-text">No cameras found on the network</p>';
                    container.classList.add('show');
                    return;
                }

                const cameraElements = cameras.map((camera, index) => `
                    <div class="discovered-camera" data-index="${index}" onclick="ipCameraModal.selectDiscoveredCamera(${index})">
                        <div style="font-weight: 500; margin-bottom: 4px;">${camera.ip_address}</div>
                        <div style="font-size: 12px; color: var(--gray-600);">
                            ${camera.manufacturer || 'Unknown'} • ${camera.protocols?.join(', ') || 'Unknown protocols'}
                        </div>
                        <div style="font-size: 11px; color: var(--gray-500); margin-top: 2px;">
                            Confidence: ${Math.round((camera.confidence || 0.5) * 100)}%
                        </div>
                    </div>
                `).join('');

                container.innerHTML = cameraElements;
                container.classList.add('show');
                this.discoveredCameras = cameras;
            }

            selectDiscoveredCamera(index) {
                const camera = this.discoveredCameras[index];
                if (!camera) return;

                // Clear previous selections
                document.querySelectorAll('.discovered-camera').forEach(cam => {
                    cam.classList.remove('selected');
                });

                // Select current camera
                document.querySelector(`[data-index="${index}"]`).classList.add('selected');

                // Fill form with discovered camera data
                document.getElementById('ipAddress').value = camera.ip_address;
                document.getElementById('cameraName').value = `${camera.manufacturer || 'IP'} Camera`;

                // Update connection type
                if (camera.protocols && camera.protocols.includes('RTSP')) {
                    document.getElementById('connectionType').value = 'rtsp';
                } else if (camera.protocols && camera.protocols.includes('HTTP')) {
                    document.getElementById('connectionType').value = 'http';
                }

                this.updateDefaultPort();
                this.validateForm();
            }

            async testConnection() {
                if (this.isTestingConnection) return;

                if (!this.validateForm()) {
                    this.showStatus('error', 'Please fill in all required fields correctly.');
                    return;
                }

                this.isTestingConnection = true;
                this.updateTestUI(true);
                this.showStatus('testing', 'Testing connection...');

                try {
                    // Simulate connection test
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    
                    // Mock success result
                    const success = Math.random() > 0.3; // 70% success rate
                    
                    if (success) {
                        this.showStatus('success', 'Connection successful! Camera is accessible.');
                        this.connectionTest = { success: true };
                    } else {
                        this.showStatus('error', 'Connection failed. Please check your settings.');
                    }
                } catch (error) {
                    console.error('Connection test error:', error);
                    this.showStatus('error', 'Connection test failed. Please check your network settings.');
                } finally {
                    this.isTestingConnection = false;
                    this.updateTestUI(false);
                }
            }

            updateTestUI(isTesting) {
                const testBtn = document.getElementById('testBtn');
                const testText = document.getElementById('testText');
                const testSpinner = document.getElementById('testSpinner');

                if (isTesting) {
                    testBtn.disabled = true;
                    testText.textContent = 'Testing...';
                    testSpinner.style.display = 'inline-block';
                } else {
                    testBtn.disabled = false;
                    testText.textContent = 'Test Connection';
                    testSpinner.style.display = 'none';
                }
            }

            showStatus(type, message) {
                const statusDiv = document.getElementById('connectionStatus');
                statusDiv.className = `connection-status show ${type}`;
                statusDiv.textContent = message;
            }

            async saveCamera() {
                if (!this.validateForm()) {
                    this.showStatus('error', 'Please fill in all required fields correctly.');
                    return;
                }

                const saveBtn = document.getElementById('saveBtn');
                saveBtn.disabled = true;
                saveBtn.textContent = 'Saving...';

                try {
                    // Simulate save operation
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    this.showStatus('success', 'Camera added successfully!');
                    
                    setTimeout(() => {
                        this.closeModal();
                        alert('Camera would be saved in a real implementation');
                    }, 1000);
                } catch (error) {
                    console.error('Save camera error:', error);
                    this.showStatus('error', 'Failed to add camera. Please try again.');
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Add Camera';
                }
            }

            closeModal() {
                const modal = document.getElementById('ipCameraModal');
                if (modal) {
                    modal.style.display = 'none';
                }
            }

            showModal() {
                const modal = document.getElementById('ipCameraModal');
                if (modal) {
                    modal.style.display = 'flex';
                    document.getElementById('cameraName').focus();
                }
            }
        }

        // Global functions for onclick handlers
        let ipCameraModal;

        function closeModal() {
            if (ipCameraModal) ipCameraModal.closeModal();
        }

        function testConnection() {
            if (ipCameraModal) ipCameraModal.testConnection();
        }

        function saveCamera() {
            if (ipCameraModal) ipCameraModal.saveCamera();
        }

        function discoverCameras() {
            if (ipCameraModal) ipCameraModal.discoverCameras();
        }

        function updateDefaultPort() {
            if (ipCameraModal) ipCameraModal.updateDefaultPort();
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            ipCameraModal = new IPCameraModal();
        });
    </script>
</body>
</html>
