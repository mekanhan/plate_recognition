# docker-compose.yml example
version: '3'

services:
  lpr-app:
    build: .
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    ports:
      - "8002:8002"
    environment:
      - DEPLOYMENT_MODE=hybrid
      - SYNC_MODE=batch
      - PROCESSING_MODE=continuous
      - CAMERA_SOURCE=mock           # Use mock camera for development
      - SYNC_INTERVAL=300            # seconds between syncs
      - CLOUD_API_URL=http://api.example.com/v1
      - REGISTRATION_TOKEN=dev_token
      - DEVICE_ID=LPR-DEV01          # Optional: Custom device ID
    restart: unless-stopped
    depends_on:
      - lpr-backup

  lpr-backup:
    image: alpine
    volumes:
      - ./data:/data
    command: |
      sh -c 'while true; do
        timestamp=$$(date +%Y%m%d_%H%M%S)
        cp /data/license_plates.db /data/backups/license_plates_$$timestamp.db
        find /data/backups -name "license_plates_*.db" -mtime +7 -delete
        sleep 86400
      done'
    restart: unless-stopped