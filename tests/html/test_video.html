<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Test</title>
</head>
<body>
    <h1>Direct Video Test</h1>
    <video id="testVideo" controls width="640" height="360">
        <source src="http://localhost:8002/api/v1/recordings/stream/camera_e4036ff5-fd9a-431a-8583-3ec721f53f1a_20250803_001742.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    
    <div id="debug"></div>
    
    <script>
        const video = document.getElementById('testVideo');
        const debug = document.getElementById('debug');
        
        video.addEventListener('loadstart', () => {
            debug.innerHTML += '<p>✅ Load started</p>';
        });
        
        video.addEventListener('loadedmetadata', () => {
            debug.innerHTML += '<p>✅ Metadata loaded</p>';
        });
        
        video.addEventListener('loadeddata', () => {
            debug.innerHTML += '<p>✅ Data loaded</p>';
        });
        
        video.addEventListener('canplay', () => {
            debug.innerHTML += '<p>✅ Can play</p>';
        });
        
        video.addEventListener('error', (e) => {
            debug.innerHTML += `<p>❌ Error: ${e.target.error?.code} - ${e.target.error?.message}</p>`;
            console.error('Video error:', e.target.error);
        });
        
        // Test network request directly
        fetch('http://localhost:8002/api/v1/recordings/stream/camera_e4036ff5-fd9a-431a-8583-3ec721f53f1a_20250803_001742.mp4', {
            method: 'HEAD'
        })
        .then(response => {
            debug.innerHTML += `<p>✅ Fetch test: ${response.status} ${response.statusText}</p>`;
            debug.innerHTML += `<p>Headers: ${JSON.stringify(Object.fromEntries(response.headers))}</p>`;
        })
        .catch(error => {
            debug.innerHTML += `<p>❌ Fetch error: ${error.message}</p>`;
        });
    </script>
</body>
</html>
