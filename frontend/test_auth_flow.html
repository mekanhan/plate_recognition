<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Authentication Flow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Test Authentication Flow</h1>
        
        <div class="card mt-4">
            <div class="card-body">
                <h5 class="card-title">Authentication Test</h5>
                
                <div class="mb-3">
                    <label>Current Token:</label>
                    <div id="tokenStatus"></div>
                </div>
                
                <div class="mb-3">
                    <label>Authentication Status:</label>
                    <div id="authStatus"></div>
                </div>
                
                <div class="mb-3">
                    <label>User Info:</label>
                    <div id="userInfo"></div>
                </div>
                
                <div class="mt-4">
                    <button class="btn btn-primary" onclick="testLogin()">Test Login</button>
                    <button class="btn btn-success" onclick="goToDashboard()">Go to Dashboard</button>
                    <button class="btn btn-warning" onclick="clearToken()">Clear Token</button>
                    <button class="btn btn-danger" onclick="testLogout()">Test Logout</button>
                </div>
                
                <div id="result" class="mt-3"></div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8001';
        
        // Check current status
        function checkStatus() {
            const token = localStorage.getItem('lpr_auth_token');
            document.getElementById('tokenStatus').innerHTML = token ? 
                `<span class="badge bg-success">Token exists (${token.substring(0, 30)}...)</span>` : 
                `<span class="badge bg-danger">No token</span>`;
            
            document.getElementById('authStatus').innerHTML = token ? 
                `<span class="badge bg-success">Authenticated</span>` : 
                `<span class="badge bg-warning">Not authenticated</span>`;
            
            if (token) {
                // Try to get user info
                fetch(`${API_BASE}/api/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('userInfo').innerHTML = `
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                })
                .catch(error => {
                    document.getElementById('userInfo').innerHTML = `
                        <span class="text-danger">Failed to get user info: ${error.message}</span>
                    `;
                });
            } else {
                document.getElementById('userInfo').innerHTML = `
                    <span class="text-muted">No user info (not logged in)</span>
                `;
            }
        }
        
        // Test login
        async function testLogin() {
            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('lpr_auth_token', data.access_token);
                    document.getElementById('result').innerHTML = `
                        <div class="alert alert-success">
                            Login successful! Token stored. You can now go to dashboard.
                        </div>
                    `;
                    checkStatus();
                } else {
                    document.getElementById('result').innerHTML = `
                        <div class="alert alert-danger">
                            Login failed: ${response.statusText}
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <div class="alert alert-danger">
                        Error: ${error.message}
                    </div>
                `;
            }
        }
        
        // Go to dashboard
        function goToDashboard() {
            window.location.href = '/';
        }
        
        // Clear token
        function clearToken() {
            localStorage.removeItem('lpr_auth_token');
            document.getElementById('result').innerHTML = `
                <div class="alert alert-info">
                    Token cleared from localStorage
                </div>
            `;
            checkStatus();
        }
        
        // Test logout
        function testLogout() {
            localStorage.removeItem('lpr_auth_token');
            window.location.href = 'index.html';
        }
        
        // Check status on load
        document.addEventListener('DOMContentLoaded', checkStatus);
    </script>
</body>
</html>
