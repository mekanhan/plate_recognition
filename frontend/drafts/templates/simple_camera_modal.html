<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Camera Setup - LPR System</title><link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/simple_camera_modal.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Additional styles specific to camera modal */
        .camera-setup-container {
            min-height: 100vh;
            padding: 20px;
            background: var(--bg-primary);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .header h1 {
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 16px;
        }

        .camera-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .camera-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .camera-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .add-camera-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 auto;
            transition: all 0.2s ease;
        }

        .add-camera-btn:hover {
            background: #2b6cb0;
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .camera-setup-container {
                padding: 15px;
            }
            
            .camera-grid {
                grid-template-columns: 1fr;
            }
            
            .add-camera-btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 30px;
            width: 95%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 20px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-muted);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            color: var(--danger-color);
            background: var(--bg-tertiary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        .form-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid var(--border-color);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background: #2b6cb0;
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
            transform: translateY(-1px);
        }

        .success-message {
            color: var(--success-color);
            background: var(--bg-tertiary);
            border: 2px solid var(--success-color);
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .error-message {
            color: var(--danger-color);
            background: var(--bg-tertiary);
            border: 2px solid var(--danger-color);
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .connection-types {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .connection-type {
            padding: 8px 12px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-tertiary);
            cursor: pointer;
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .connection-type:hover {
            border-color: var(--accent-color);
            background: var(--accent-color);
            color: white;
        }

        .connection-type.active {
            border-color: var(--accent-color);
            background: var(--accent-color);
            color: white;
        }

        .stream-paths {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }

        .stream-paths h4 {
            margin: 0 0 10px 0;
            color: var(--text-primary);
            font-size: 14px;
        }

        .path-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .path-option {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .path-option:hover {
            background: var(--accent-color);
            color: white;
        }

        @media (max-width: 768px) {
            .modal {
                width: 98%;
                padding: 20px;
                margin: 10px;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .form-buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
            
            .connection-types {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body class="camera-setup-container">
    <div class="header">
        <h1><i class="fas fa-video"></i> IP Camera Setup</h1>
        <p>Connect and manage your IP cameras for license plate recognition</p>
    </div>
    
    <div class="camera-grid" id="cameraGrid">
        <!-- Cameras will be loaded here -->
    </div><button class="add-camera-btn" id="addCameraBtn">
        <i class="fas fa-plus"></i>
        Add New IP Camera
    </button>

    <!-- Enhanced Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">
                    <i class="fas fa-camera"></i>
                    Add New IP Camera
                </h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <form id="cameraForm">
                <!-- Basic Information -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Camera Name *</label>
                        <input type="text" class="form-input" id="cameraName" placeholder="e.g., Front Door Camera" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Location</label>
                        <input type="text" class="form-input" id="location" placeholder="Front Door">
                    </div>
                </div>

                <!-- Connection Type Selection -->
                <div class="form-group">
                    <label class="form-label">Camera Brand/Type</label>
                    <div class="connection-types">
                        <div class="connection-type active" data-type="reolink">Reolink</div>
                        <div class="connection-type" data-type="hikvision">Hikvision</div>
                        <div class="connection-type" data-type="dahua">Dahua</div>
                        <div class="connection-type" data-type="axis">Axis</div>
                        <div class="connection-type" data-type="generic">Generic RTSP</div>
                        <div class="connection-type" data-type="onvif">ONVIF</div>
                    </div>
                </div>
                
                <!-- Network Configuration -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">IP Address *</label>
                        <input type="text" class="form-input" id="ipAddress" placeholder="192.168.1.100" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Port</label>
                        <input type="number" class="form-input" id="port" placeholder="554" value="554">
                    </div>
                </div>
                
                <!-- Authentication -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-input" id="username" placeholder="admin" value="admin">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="password" placeholder="password">
                    </div>
                </div>
                
                <!-- Stream Configuration -->
                <div class="form-group">
                    <label class="form-label">Stream Path</label>
                    <input type="text" class="form-input" id="streamPath" placeholder="/h264Preview_01_main">
                    <div class="stream-paths" id="streamPaths">
                        <h4>Common paths for <span id="selectedType">Reolink</span>:</h4>
                        <div class="path-options" id="pathOptions">
                            <!-- Dynamic paths will be loaded here -->
                        </div>
                    </div>
                </div>

                <!-- Advanced Options -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Connection Protocol</label>
                        <select class="form-select" id="protocol">
                            <option value="rtsp">RTSP</option>
                            <option value="http">HTTP</option>
                            <option value="https">HTTPS</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Stream Quality</label>
                        <select class="form-select" id="quality">
                            <option value="main">Main Stream (High)</option>
                            <option value="sub">Sub Stream (Low)</option>
                        </select>
                    </div>
                </div>
                
                <div id="message"></div>
                
                <div style="margin-top: 20px; margin-bottom: 20px; padding: 10px; background: #f5f5f5; border-radius: 8px;">
                    <h4 style="margin-top: 0; color: #333;">Diagnostic Tools</h4>
                    <button type="button" onclick="runDiagnostics()" style="background: #6c757d; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">
                        <i class="fas fa-stethoscope"></i> Run API Diagnostics
                    </button>
                    <div id="diagnosticsResult" style="margin-top: 10px; font-size: 12px; max-height: 150px; overflow-y: auto;"></div>
                </div>

                <div class="form-buttons">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                    <button type="button" class="btn btn-success" onclick="testConnection()">
                        <i class="fas fa-plug"></i> Test Connection
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Camera
                        </button>
                    </div>
            </form>
        </div>
    </div><script src="/static/js/simple_camera_modal.js"></script>
    <script>
        // Camera configurations with defaults for different brands
        const cameraConfigs = {
            reolink: {
                name: 'Reolink',
                defaultPort: 554,
                defaultUsername: 'admin',
                streamPaths: [
                    '/h264Preview_01_main',
                    '/h264Preview_01_sub',
                    '/cam/realmonitor?channel=1&subtype=0',
                    '/Preview_01_main',
                    '/Preview_01_sub'
                ]
                },
            hikvision: {
                name: 'Hikvision',
                defaultPort: 554,
                defaultUsername: 'admin',
                streamPaths: [
                    '/ISAPI/Streaming/channels/101',
                    '/ISAPI/Streaming/channels/102',
                    '/Streaming/Channels/101',
                    '/Streaming/Channels/102',
                    '/h264/ch1/main/av_stream',
                    '/h264/ch1/sub/av_stream'
                ]
            },
            dahua: {
                name: 'Dahua',
                defaultPort: 554,
                defaultUsername: 'admin',
                streamPaths: [
                    '/cam/realmonitor?channel=1&subtype=0',
                    '/cam/realmonitor?channel=1&subtype=1',
                    '/live/1/0',
                    '/live/1/1',
                    '/channel1'
                ]
            },
            axis: {
                name: 'Axis',
                defaultPort: 554,
                defaultUsername: 'root',
                streamPaths: [
                    '/axis-media/media.amp',
                    '/axis-media/media.amp?resolution=640x480',
                    '/axis-media/media.amp?resolution=1920x1080',
                    '/mjpg/video.mjpg',
                    '/mjpg/1/video.mjpg'
                ]
            },
            generic: {
                name: 'Generic RTSP',
                defaultPort: 554,
                defaultUsername: 'admin',
                streamPaths: [
                    '/stream1',
                    '/stream2',
                    '/live',
                    '/rtsp_live',
                    '/cam1',
                    '/video1'
                ]
            },
            onvif: {
                name: 'ONVIF',
                defaultPort: 80,
                defaultUsername: 'admin',
                streamPaths: [
                    '/onvif1',
                    '/onvif2',
                    '/MediaInput/h264',
                    '/MediaInput/mjpeg'
                ]
            }
        };

        let currentCameraType = 'reolink';
        let editingCameraId = null;
        let editingCamera = null;// Modal Functions are now in simple_camera_modal.js

        function clearForm() {
            document.getElementById('cameraForm').reset();
            document.getElementById('message').innerHTML = '';

            // Reset editing state
            editingCameraId = null;
            editingCamera = null;

            // Reset modal title and button text
            document.querySelector('.modal-title').innerHTML = '<i class="fas fa-camera"></i> Add New IP Camera';
            const saveBtn = document.querySelector('button[type="submit"]');
            saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Camera';

            // Reset to default camera type
            setActiveConnectionType('reolink');
        }

        function showMessage(message, type = 'success') {
            const messageDiv = document.getElementById('message');
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle';
            messageDiv.innerHTML = `<div class="${type}-message"><i class="fas ${icon}"></i>${message}</div>`;
        }

        // Camera Type Selection
        function setActiveConnectionType(type) {
            // Update active state
            document.querySelectorAll('.connection-type').forEach(el => {
                el.classList.remove('active');
                if (el.dataset.type === type) {
                    el.classList.add('active');
                }
        });

            currentCameraType = type;
            updateCameraDefaults(type);
        }

        function updateCameraDefaults(type) {
            const config = cameraConfigs[type];

            // Update port
            document.getElementById('port').value = config.defaultPort;

            // Update username
            document.getElementById('username').value = config.defaultUsername;

            // Update stream paths
            document.getElementById('selectedType').textContent = config.name;
            const pathOptionsDiv = document.getElementById('pathOptions');
            pathOptionsDiv.innerHTML = config.streamPaths.map(path =>
                `<span class="path-option" onclick="selectStreamPath('${path}')">${path}</span>`
            ).join('');

            // Set first path as default
            if (config.streamPaths.length > 0) {
                document.getElementById('streamPath').value = config.streamPaths[0];
            }
        }

        function selectStreamPath(path) {
            document.getElementById('streamPath').value = path;
        }

        // Connection testing
        async function testConnection() {
            const ipAddress = document.getElementById('ipAddress').value;
            const port = document.getElementById('port').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const streamPath = document.getElementById('streamPath').value;
            const protocol = document.getElementById('protocol').value;

            if (!ipAddress) {
                showMessage('Please enter an IP address first', 'error');
                return;
            }

            showMessage(`Testing connection to ${ipAddress}:${port}...`, 'success');

            try {
                console.log('Testing connection with data:', {
                        connection_type: protocol,
                        ip_address: ipAddress,
                        port: port || '',
                        username: username || 'admin',
                        password: password || '',
                        stream_path: streamPath || ''
                });

                // Make actual API call to test connection
                const response = await fetch('/api/cameras/test-connection', {
                    method: 'POST',
                    headers: {
                            'Content-Type': 'application/json',
                        },
                    body: JSON.stringify({
                        connection_type: protocol,
                        ip_address: ipAddress,
                        port: port || '',
                        username: username || 'admin',
                        password: password || '',
                        stream_path: streamPath || ''
                    })
                    });

                console.log('Test connection response status:', response.status);

                if (response.ok) {
                    const result = await response.json();
                    console.log('Test connection result:', result);

                    if (result.success) {
                        showMessage(`✓ Connection successful! ${result.message || 'Camera is reachable'}`, 'success');
                    } else {
                        showMessage(`✗ Connection failed: ${result.message || 'Cannot reach camera'}`, 'error');
                    }
                } else {
                    try {
                        const error = await response.json();
                        console.error('Connection test API error:', error);
                        showMessage(`✗ Connection test failed: ${error.detail || 'Server error'}`, 'error');
                    } catch (e) {
                    const text = await response.text();
                        console.error('Connection test non-JSON error:', text);
                        showMessage(`✗ Connection test failed: ${response.status} ${response.statusText}`, 'error');
                }
                }
            } catch (error) {
                console.error('Connection test error:', error);
                showMessage(`✗ Network error during connection test: ${error.message}`, 'error');
            }
        }

        // Form submission
        document.getElementById('cameraForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // First, ensure we have a location_id - create default if needed
            let locationId = 'default-location';
            try {
                console.log('Fetching locations...');
                const locationResponse = await fetch('/api/locations');
                console.log('Locations response status:', locationResponse.status);

                if (locationResponse.ok) {
                    const locations = await locationResponse.json();
                    console.log('Locations data:', locations);

                    if (locations && locations.length > 0) {
                        locationId = locations[0].id;
                        console.log('Using existing location ID:', locationId);
                    } else {
                        // Try to create a default location
                        console.log('No locations found, creating default...');
                        try {
                            const createLocationResponse = await fetch('/api/locations', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    name: 'Default Location',
                                    description: 'Default location for cameras'
                                })
                            });
                            console.log('Create location response:', createLocationResponse.status);
                            if (createLocationResponse.ok) {
                                const newLocation = await createLocationResponse.json();
                                console.log('New location created:', newLocation);
                                locationId = newLocation.location_id || newLocation.id || 'default-location';
                                console.log('Using new location ID:', locationId);
                            } else {
                                console.error('Failed to create location:', await createLocationResponse.text());
                            }
                        } catch (createError) {
                            console.error('Could not create default location:', createError);
                        }
                    }
                } else {
                    console.error('Error fetching locations:', await locationResponse.text());
                }
            } catch (error) {
                console.error('Error processing locations:', error);
            }

            // Map form data to API expected format
            const formData = {
                name: document.getElementById('cameraName').value,
                ip_address: document.getElementById('ipAddress').value,
                location_id: locationId, // Required by API
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                manufacturer: currentCameraType,
                camera_type: "ip_camera",
                installation_location: document.getElementById('location').value || null,
                resolution_width: 1920,
                resolution_height: 1080,
                fps: 30,
                port: parseInt(document.getElementById('port').value), // Include port explicitly
                stream_path: document.getElementById('streamPath').value // Include stream path
            };

            if (!formData.name || !formData.ip_address) {
                showMessage('Please fill in required fields (Name and IP Address)', 'error');
                return;
            }

            console.log('Sending camera data:', formData);
            try {
                let response;
                let url;
                let method;

                if (editingCameraId) {
                    // Update existing camera
                    url = `/api/cameras/${editingCameraId}`;
                    method = 'PUT';
                    console.log(`Updating camera ${editingCameraId} at ${url}`);

                    // For update, use only fields that we should update
                    const updateData = {
                        name: formData.name,
                        ip_address: formData.ip_address,
                        location_id: formData.location_id,
                        username: formData.username,
                        password: formData.password,
                        manufacturer: formData.manufacturer,
                        installation_location: formData.installation_location,
                        resolution_width: formData.resolution_width,
                        resolution_height: formData.resolution_height,
                        fps: formData.fps,
                        port: formData.port,
                        stream_path: formData.stream_path
                    };

                    response = await fetch(url, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(updateData)
                    });
                } else {
                    // Create new camera
                    url = '/api/cameras';
                    method = 'POST';
                    console.log(`Creating new camera at ${url}`);

                    response = await fetch(url, {
                        method: method,
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData)
                    });
                }

                console.log('API Response Status:', response.status, response.statusText);

                // Enhanced debugging for responses
                const contentType = response.headers.get('content-type');
                console.log('Response content type:', contentType);

                let result;

                if (contentType && contentType.includes('application/json')) {
                    result = await response.json();
                    console.log('API Response data:', result);
                } else {
                    // Handle non-JSON responses
                    const text = await response.text();
                    console.error('Non-JSON response:', text);
                    result = { detail: text || 'Unknown server error' };
                }

                if (response.ok) {
                    const action = editingCameraId ? 'updated' : 'saved';
                    showMessage(`✓ Camera ${action} successfully!`, 'success');
                    setTimeout(() => {
                        closeModal();
                        loadCameras();
                    }, 1500);
                } else {
                    // More detailed error handling
                    console.error('API Error Response:', response.status, response.statusText);
                    console.error('Error Details:', result);

                    let errorMsg;
                    if (typeof result === 'object') {
                        errorMsg = result.detail?.message || result.detail || `Failed to ${editingCameraId ? 'update' : 'save'} camera (${response.status}: ${response.statusText})`;
                    } else {
                        errorMsg = `Failed to ${editingCameraId ? 'update' : 'save'} camera (${response.status}: ${response.statusText})`;
                    }

                    showMessage(`✗ ${errorMsg}`, 'error');
                }
            } catch (error) {
                console.error('Network error:', error);
                showMessage(`✗ Network error - please try again: ${error.message}`, 'error');
            }
        });

        // Event Listeners
        document.querySelectorAll('.connection-type').forEach(el => {
            el.addEventListener('click', () => setActiveConnectionType(el.dataset.type));
        });

        // Close modal when clicking outside
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Close modal with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Load cameras
        async function loadCameras() {
            const grid = document.getElementById('cameraGrid');

            try {
                console.log('Fetching cameras from API...');
                const response = await fetch('/api/cameras');
                console.log('API Response Status:', response.status);

                if (response.ok) {
                    const contentType = response.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        const cameras = await response.json();
                        console.log('Cameras data received:', cameras);
                        displayCameras(cameras);
                    } else {
                        console.error('API returned non-JSON response');
                        const text = await response.text();
                        console.error('Response content:', text);
                        displayMockCameras();
                        grid.innerHTML += `<div style="color: red; margin-top: 20px; text-align: center;">
                            API returned non-JSON response. Check console for details.
                        </div>`;
                    }
                } else {
                    console.error('API returned error status:', response.status);
                    try {
                        const errorText = await response.text();
                        console.error('Error details:', errorText);
                    } catch (e) {
                        console.error('Could not read error details');
                    }
                    // Fallback to mock data
                    displayMockCameras();
                    grid.innerHTML += `<div style="color: red; margin-top: 20px; text-align: center;">
                        API error: ${response.status} ${response.statusText}. Using mock data.
                    </div>`;
                }
            } catch (error) {
                console.error('Error loading cameras:', error);
                displayMockCameras();
                grid.innerHTML += `<div style="color: red; margin-top: 20px; text-align: center;">
                    Network error: ${error.message}. Using mock data.
                </div>`;
            }
        }

        function displayCameras(cameras) {
            const grid = document.getElementById('cameraGrid');

            if (!cameras || cameras.length === 0) {
                grid.innerHTML = '<div class="camera-card" style="text-align: center; color: var(--text-muted);"><i class="fas fa-video-slash" style="font-size: 2em; margin-bottom: 10px;"></i><h3>No cameras configured</h3><p>Click "Add New IP Camera" to get started</p></div>';
                return;
            }

            grid.innerHTML = cameras.map(camera => {
                // Handle different possible field names from API
                const cameraName = camera.name || camera.camera_name || 'Unknown Camera';
                const ipAddress = camera.ip_address || camera.ip || 'Unknown IP';
                const status = camera.status || camera.connection_status || 'Unknown';
                const location = camera.installation_location || camera.location || 'No location';
                const manufacturer = camera.manufacturer || camera.camera_type || 'generic';
                const cameraId = camera.id || camera.camera_id;

                return `
                <div class="camera-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h3 style="margin: 0; color: var(--text-primary);">
                            <i class="fas fa-video" style="margin-right: 8px;"></i>
                            ${cameraName}
                        </h3>
                        <span class="status-badge" style="padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; ${status.toLowerCase() === 'online' || status.toLowerCase() === 'active' ? 'background: var(--success-color); color: white;' : 'background: var(--danger-color); color: white;'}">
                            ${status}
                        </span>
                    </div>
                    <div style="color: var(--text-secondary); font-size: 14px; line-height: 1.5;">
                        <p style="margin: 5px 0;"><i class="fas fa-network-wired" style="width: 16px;"></i> ${ipAddress}</p>
                        <p style="margin: 5px 0;"><i class="fas fa-map-marker-alt" style="width: 16px;"></i> ${location}</p>
                        <p style="margin: 5px 0;"><i class="fas fa-tag" style="width: 16px;"></i> ${cameraConfigs[manufacturer]?.name || manufacturer}</p>
                    </div>
                    <div style="margin-top: 15px; display: flex; gap: 8px;">
                        <button class="btn btn-secondary" style="flex: 1; padding: 8px 12px; font-size: 12px;" onclick="editCamera('${cameraId}')">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="btn btn-danger" style="flex: 1; padding: 8px 12px; font-size: 12px;" onclick="deleteCamera('${cameraId}')">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        function displayMockCameras() {
            const mockCameras = [
                {
                    id: '1',
                    name: 'Front Door Camera',
                    ip_address: '192.168.1.100',
                    port: 554,
                    location: 'Main Entrance',
                    camera_type: 'reolink',
                    status: 'Online'
                },
                {
                    id: '2',
                    name: 'Parking Lot Camera',
                    ip_address: '192.168.1.101',
                    port: 554,
                    location: 'Parking Area',
                    camera_type: 'hikvision',
                    status: 'Offline'
                }
            ];
            displayCameras(mockCameras);
        }

        async function editCamera(id) {
            console.log('Edit camera:', id);

            try {
                console.log(`Fetching camera details for ${id}`);
                // Fetch camera details
                const response = await fetch(`/api/cameras/${id}`);
                console.log('Camera details response status:', response.status);

                if (response.ok) {
                    const camera = await response.json();
                    console.log('Camera details received:', camera);
                    openEditModal(camera);
                } else {
                    console.error('Failed to fetch camera details:', response.status, response.statusText);
                    try {
                        const errorText = await response.text();
                        console.error('Error details:', errorText);
                    } catch (e) {
                        console.error('Could not read error details');
            }
                    showMessage('✗ Failed to load camera details', 'error');
        }
                } catch (error) {
                console.error('Error loading camera:', error);
                showMessage('✗ Network error - could not load camera details', 'error');
                }
            }

        async function deleteCamera(id) {
            if (confirm('Are you sure you want to delete this camera? This action cannot be undone.')) {
                try {
                    const response = await fetch(`/api/cameras/${id}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        showMessage('✓ Camera deleted successfully', 'success');
                        setTimeout(() => {
            loadCameras();
                        }, 1000);
                    } else {
                        const error = await response.json().catch(() => ({}));
                        const errorMsg = error.detail?.message || error.detail || 'Failed to delete camera';
                        showMessage(`✗ ${errorMsg}`, 'error');
                    }
                } catch (error) {
                    console.error('Error deleting camera:', error);
                    showMessage('✗ Network error - could not delete camera', 'error');
                }
            }
        }// Initialize on page load with additional modal debugging
        document.addEventListener('DOMContentLoaded', function() {
            loadCameras();
            setActiveConnectionType('reolink');
            
            // Add direct event listener to button
            document.getElementById('addCameraBtn').addEventListener('click', function() {
                console.log('Add camera button clicked directly');
                const modalOverlay = document.getElementById('modalOverlay');
                modalOverlay.style.display = 'block';
            });
            
            // Make closeModal button work
            document.querySelector('.close-btn').addEventListener('click', function() {
                console.log('Close button clicked');
                document.getElementById('modalOverlay').style.display = 'none';
            });
            
            console.log('Modal setup complete');
        });

        // Diagnostic function to check API endpoints
        async function runDiagnostics() {
            const diagnosticsDiv = document.getElementById('diagnosticsResult');
            diagnosticsDiv.innerHTML = '<p>Running diagnostics...</p>';

            const results = [];

            // Test endpoints
            const endpoints = [
                { name: 'Cameras API', url: '/api/cameras', method: 'GET' },
                { name: 'Locations API', url: '/api/locations', method: 'GET' },
                { name: 'Test Connection API', url: '/api/cameras/test-connection', method: 'POST',
                  body: { connection_type: 'rtsp', ip_address: '192.168.1.100', port: '554', username: 'admin', password: '' } }
            ];

            for (const endpoint of endpoints) {
                try {
                    const options = {
                        method: endpoint.method,
                        headers: { 'Content-Type': 'application/json' }
                    };

                    if (endpoint.body) {
                        options.body = JSON.stringify(endpoint.body);
                    }

                    const response = await fetch(endpoint.url, options);
                    const contentType = response.headers.get('content-type');

                    let resultText = '';
                    if (contentType && contentType.includes('application/json')) {
                        const data = await response.json();
                        resultText = `Status: ${response.status} - JSON Response received`;
                    } else {
                        const text = await response.text();
                        resultText = `Status: ${response.status} - Non-JSON Response: ${text.substring(0, 100)}${text.length > 100 ? '...' : ''}`;
                    }

                    results.push(`<p><strong>${endpoint.name}</strong>: ${resultText}</p>`);
                } catch (error) {
                    results.push(`<p><strong>${endpoint.name}</strong>: Error - ${error.message}</p>`);
                }
            }

            // Test system health
            try {
                const response = await fetch('/health');
                const health = await response.json();
                results.push(`<p><strong>System Health</strong>: ${health.status}, Mode: ${health.mode}</p>`);

                if (health.services) {
                    const serviceStatus = Object.entries(health.services)
                        .map(([service, active]) => `${service}: ${active ? '✓' : '✗'}`)
                        .join(', ');
                    results.push(`<p><strong>Services</strong>: ${serviceStatus}</p>`);
                }
            } catch (error) {
                results.push(`<p><strong>System Health</strong>: Error - ${error.message}</p>`);
            }

            diagnosticsDiv.innerHTML = results.join('');
        }
    </script>
</body>
</html>
