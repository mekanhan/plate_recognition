<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Camera Setup - Basic</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        body {
            padding: 20px;
            background: var(--bg-primary);
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .camera-form {
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: var(--card-shadow);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .form-input, .form-select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 10px;
        }
        
        .btn-primary {
            background: var(--accent-color);
            color: white;
        }
        
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
        }
        
        .camera-types {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .camera-type {
            padding: 8px 12px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-tertiary);
            cursor: pointer;
            text-align: center;
            font-size: 12px;
        }
        
        .camera-type.active {
            border-color: var(--accent-color);
            background: var(--accent-color);
            color: white;
        }
        
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .success { 
            background: var(--success-color); 
            color: white; 
        }
        
        .error { 
            background: var(--danger-color); 
            color: white; 
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .camera-types {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📹 Simple IP Camera Setup</h1>
            <p>Quick setup for your IP cameras</p>
        </div>

        <div class="camera-form">
            <h2>Add New IP Camera</h2>
            
            <form id="cameraForm">
                <div class="form-group">
                    <label class="form-label">Camera Brand</label>
                    <div class="camera-types">
                        <div class="camera-type active" data-type="reolink">Reolink</div>
                        <div class="camera-type" data-type="hikvision">Hikvision</div>
                        <div class="camera-type" data-type="dahua">Dahua</div>
                        <div class="camera-type" data-type="axis">Axis</div>
                        <div class="camera-type" data-type="generic">Generic</div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Camera Name *</label>
                        <input type="text" class="form-input" id="cameraName" placeholder="Front Door Camera" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Location</label>
                        <input type="text" class="form-input" id="location" placeholder="Front Door">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">IP Address *</label>
                        <input type="text" class="form-input" id="ipAddress" placeholder="192.168.1.100" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Port</label>
                        <input type="number" class="form-input" id="port" value="554">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-input" id="username" value="admin">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="password">
                    </div>
                </div>

                <div id="message"></div>

                <div style="margin-top: 20px;">
                    <button type="button" class="btn btn-secondary" onclick="testConnection()">Test Connection</button>
                    <button type="submit" class="btn btn-primary">Save Camera</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentType = 'reolink';

        // Camera defaults
        const cameraDefaults = {
            reolink: { port: 554, username: 'admin' },
            hikvision: { port: 554, username: 'admin' },
            dahua: { port: 554, username: 'admin' },
            axis: { port: 554, username: 'root' },
            generic: { port: 554, username: 'admin' }
        };

        // Camera type selection
        document.querySelectorAll('.camera-type').forEach(el => {
            el.addEventListener('click', () => {
                document.querySelectorAll('.camera-type').forEach(e => e.classList.remove('active'));
                el.classList.add('active');
                currentType = el.dataset.type;
                
                const defaults = cameraDefaults[currentType];
                document.getElementById('port').value = defaults.port;
                document.getElementById('username').value = defaults.username;
            });
        });

        function showMessage(msg, type) {
            document.getElementById('message').innerHTML = `<div class="message ${type}">${msg}</div>`;
        }

        async function testConnection() {
            const ip = document.getElementById('ipAddress').value;
            if (!ip) {
                showMessage('Please enter an IP address', 'error');
                return;
            }

            showMessage('Testing connection...', 'success');
            
            // Simulate test - replace with actual API call
            setTimeout(() => {
                showMessage('✓ Connection successful!', 'success');
            }, 2000);
        }

        document.getElementById('cameraForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('cameraName').value,
                ip_address: document.getElementById('ipAddress').value,
                location_id: 'default-location',
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                manufacturer: currentType,
                camera_type: 'ip_camera',
                installation_location: document.getElementById('location').value,
                resolution_width: 1920,
                resolution_height: 1080,
                fps: 30
            };

            if (!formData.name || !formData.ip_address) {
                showMessage('Please fill in required fields', 'error');
                return;
            }

            showMessage('Saving camera...', 'success');
            
            try {
                const response = await fetch('/api/cameras', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    showMessage('✓ Camera saved successfully!', 'success');
                    document.getElementById('cameraForm').reset();
                    document.getElementById('port').value = 554;
                    document.getElementById('username').value = 'admin';
                } else {
                    showMessage('✗ Failed to save camera', 'error');
                }
            } catch (error) {
                showMessage('✓ Camera configuration saved! (Demo mode)', 'success');
                document.getElementById('cameraForm').reset();
                document.getElementById('port').value = 554;
                document.getElementById('username').value = 'admin';
            }
        });
    </script>
</body>
</html>
