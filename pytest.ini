[pytest]
# Pytest configuration for LPR System

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.8

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-config=.coveragerc

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for service interactions
    functional: End-to-end functional tests
    performance: Performance and load tests
    slow: Tests that take a long time to run
    gpu: Tests that require GPU
    camera: Tests that require camera hardware
    database: Tests that interact with database
    api: API endpoint tests
    auth: Authentication tests
    monitoring: Monitoring system tests
    analytics: Analytics system tests

# Ignore paths
norecursedirs = .git .tox venv .venv env build dist *.egg migrations logs recordings data

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds)
timeout = 300

# Parallel execution (if pytest-xdist is installed)
# addopts = -n auto