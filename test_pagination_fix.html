<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagination Fix Test</title>
    <link rel="stylesheet" href="frontend/src/styles/base/variables.css">
    <link rel="stylesheet" href="frontend/src/styles/components/detection-console.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .test-container { max-width: 1200px; margin: 0 auto; }
        .test-results { background: #f8fafc; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .success { color: #059669; } .error { color: #dc2626; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Detection Console Pagination Fix Test</h1>
        
        <div class="test-results" id="test-results">
            <h3>Test Results:</h3>
            <div id="results-output">Running tests...</div>
        </div>

        <div id="detection-console-container"></div>
    </div>

    <script type="module">
        import DetectionConsole from './frontend/src/components/detection/DetectionConsole.js';
        
        // Test data for pagination
        const mockDetections = Array.from({length: 125}, (_, i) => ({
            id: `test-${i}`,
            camera_name: `Camera ${(i % 3) + 1}`,
            plate_text: `ABC${String(i).padStart(3, '0')}`,
            confidence: 0.85 + (Math.random() * 0.15),
            detected_at: new Date(Date.now() - i * 3600000).toISOString(),
            status: ['unverified', 'verified', 'flagged'][i % 3]
        }));

        // Mock API for testing
        const originalFetch = window.fetch;
        window.fetch = async (url, options) => {
            if (url.includes('/api/detections/search')) {
                const urlObj = new URL(url);
                const offset = parseInt(urlObj.searchParams.get('offset') || '0');
                const limit = parseInt(urlObj.searchParams.get('limit') || '50');
                
                const results = mockDetections.slice(offset, offset + limit);
                
                return {
                    ok: true,
                    json: async () => ({
                        results,
                        total_count: mockDetections.length,
                        pagination: {
                            total: mockDetections.length,
                            offset,
                            limit,
                            has_more: offset + limit < mockDetections.length
                        }
                    })
                };
            }
            return originalFetch(url, options);
        };

        async function runTests() {
            const resultsDiv = document.getElementById('results-output');
            const results = [];
            
            try {
                // Initialize detection console
                const container = document.getElementById('detection-console-container');
                const console = new DetectionConsole(container);
                
                // Wait for initial load
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Test 1: Check if pagination buttons exist
                const firstBtn = document.getElementById('first-page');
                const nextBtn = document.getElementById('next-page');
                const prevBtn = document.getElementById('prev-page');
                const lastBtn = document.getElementById('last-page');
                
                results.push({
                    test: 'Pagination buttons exist',
                    status: firstBtn && nextBtn && prevBtn && lastBtn ? 'success' : 'error',
                    details: `Found: first(${!!firstBtn}), next(${!!nextBtn}), prev(${!!prevBtn}), last(${!!lastBtn})`
                });
                
                // Test 2: Check if sticky headers are properly positioned
                const tableHeaders = document.querySelectorAll('.detection-table th');
                const firstHeader = tableHeaders[0];
                const headerStyle = getComputedStyle(firstHeader);
                
                results.push({
                    test: 'Sticky header positioning',
                    status: headerStyle.position === 'sticky' && headerStyle.top === '0px' ? 'success' : 'error',
                    details: `Position: ${headerStyle.position}, Top: ${headerStyle.top}`
                });
                
                // Test 3: Test pagination click (next page)
                let pageBefore = console.currentPage;
                nextBtn.click();
                
                // Wait for async operation
                await new Promise(resolve => setTimeout(resolve, 500));
                let pageAfter = console.currentPage;
                
                results.push({
                    test: 'Next page button functionality',
                    status: pageAfter > pageBefore ? 'success' : 'error',
                    details: `Page changed from ${pageBefore} to ${pageAfter}`
                });
                
                // Test 4: Test pagination click (previous page)
                pageBefore = console.currentPage;
                prevBtn.click();
                
                await new Promise(resolve => setTimeout(resolve, 500));
                pageAfter = console.currentPage;
                
                results.push({
                    test: 'Previous page button functionality',
                    status: pageAfter < pageBefore ? 'success' : 'error',
                    details: `Page changed from ${pageBefore} to ${pageAfter}`
                });
                
                // Test 5: Check total records display
                const paginationInfo = document.getElementById('pagination-info');
                const infoText = paginationInfo ? paginationInfo.textContent : '';
                
                results.push({
                    test: 'Pagination info display',
                    status: infoText.includes('125') ? 'success' : 'error',
                    details: `Info text: "${infoText}"`
                });
                
            } catch (error) {
                results.push({
                    test: 'Overall test execution',
                    status: 'error',
                    details: `Error: ${error.message}`
                });
            }
            
            // Display results
            resultsDiv.innerHTML = results.map(result => `
                <div class="${result.status}">
                    <strong>${result.test}:</strong> 
                    <span class="${result.status}">${result.status.toUpperCase()}</span>
                    <br><small>${result.details}</small>
                </div>
            `).join('<br>');
        }
        
        // Run tests after page load
        runTests();
    </script>
</body>
</html>
