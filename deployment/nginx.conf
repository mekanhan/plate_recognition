events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Rate limiting for API
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=snapshots:10m rate=2r/s;

    # Upstream backend
    upstream lpr_backend {
        server lpr-app:8000;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Frontend static files
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            
            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # API endpoints (rate limited)
        location /api {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://lpr_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeout settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Camera snapshots (more restrictive rate limit)
        location /api/cameras {
            limit_req zone=snapshots burst=5 nodelay;
            
            proxy_pass http://lpr_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            proxy_pass http://lpr_backend;
            access_log off;
        }

        # Detection images
        location /images {
            proxy_pass http://lpr_backend;
            
            # Cache images
            expires 1h;
            add_header Cache-Control "public";
        }

        # Video clips
        location /api/video {
            proxy_pass http://lpr_backend;
            proxy_buffering off;
            
            # Large files support
            client_max_body_size 0;
            proxy_max_temp_file_size 0;
            
            # Streaming headers
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }
    }
}