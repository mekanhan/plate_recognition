<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discovery Wizard Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        
        .test-button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px;
        }
        
        .test-button:hover {
            background: #0056b3;
        }
        
        .status {
            margin: 10px;
            padding: 10px;
            border-radius: 4px;
        }
        
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>Discovery Wizard Test</h1>
    
    <button class="test-button" id="test-discovery-btn">Test Discovery Wizard Button</button>
    
    <div id="status-container"></div>
    
    <script>
        // Simple test to verify button functionality
        document.getElementById('test-discovery-btn').addEventListener('click', function() {
            const statusContainer = document.getElementById('status-container');
            
            // Test if the discovery wizard button exists in the main page
            const discoveryBtn = document.getElementById('discovery-wizard-btn');
            
            if (discoveryBtn) {
                statusContainer.innerHTML = '<div class="status success">✓ Discovery wizard button found!</div>';
                
                // Try to click it
                try {
                    discoveryBtn.click();
                    statusContainer.innerHTML += '<div class="status success">✓ Button clicked successfully!</div>';
                } catch (error) {
                    statusContainer.innerHTML += '<div class="status error">✗ Error clicking button: ' + error.message + '</div>';
                }
            } else {
                statusContainer.innerHTML = '<div class="status error">✗ Discovery wizard button not found!</div>';
            }
            
            // Check if the wizard class exists
            if (typeof CameraDiscoveryWizard !== 'undefined') {
                statusContainer.innerHTML += '<div class="status success">✓ CameraDiscoveryWizard class found!</div>';
            } else {
                statusContainer.innerHTML += '<div class="status error">✗ CameraDiscoveryWizard class not found!</div>';
            }
            
            // Check if the wizard instance exists
            if (typeof window.discoveryWizard !== 'undefined') {
                statusContainer.innerHTML += '<div class="status success">✓ Discovery wizard instance found!</div>';
                
                // Try to open the wizard directly
                try {
                    window.discoveryWizard.openWizard();
                    statusContainer.innerHTML += '<div class="status success">✓ Wizard opened directly!</div>';
                } catch (error) {
                    statusContainer.innerHTML += '<div class="status error">✗ Error opening wizard: ' + error.message + '</div>';
                }
            } else {
                statusContainer.innerHTML += '<div class="status error">✗ Discovery wizard instance not found!</div>';
            }
        });
    </script>
</body>
</html>
