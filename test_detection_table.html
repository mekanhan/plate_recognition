<!DOCTYPE html>
<html>
<head>
    <title>Detection Table Test</title>
</head>
<body>
    <div id="test-output"></div>
    
    <script>
        // Test the detection data and image URL construction
        async function testDetectionData() {
            try {
                const response = await fetch('/api/detections/recent?limit=5');
                const detections = await response.json();
                
                const output = document.getElementById('test-output');
                output.innerHTML = '<h3>Detection Data Test</h3>';
                
                detections.forEach((detection, i) => {
                    const plateImage = detection.plate_image;
                    const frameImage = detection.frame_image;
                    
                    // Test the URL construction logic from DetectionTable
                    const plateUrl = plateImage ? '/images/' + plateImage.replace('detections/', '') : '/static/images/no-image.png';
                    const frameUrl = frameImage ? '/images/' + frameImage.replace('detections/', '') : '/static/images/no-image.png';
                    
                    output.innerHTML += `
                        <div style="border: 1px solid #ccc; margin: 10px; padding: 10px;">
                            <h4>Detection ${i + 1}: ${detection.plate_text}</h4>
                            <p><strong>Original plate_image:</strong> ${plateImage}</p>
                            <p><strong>Constructed URL:</strong> ${plateUrl}</p>
                            <img src="${plateUrl}" style="max-width: 100px; border: 1px solid red;" 
                                 onerror="this.style.border='2px solid red'; this.alt='FAILED TO LOAD';" 
                                 onload="this.style.border='2px solid green';">
                            <p><strong>Has images:</strong> ${plateImage !== null}</p>
                        </div>
                    `;
                });
            } catch (error) {
                document.getElementById('test-output').innerHTML = `<h3>Error: ${error.message}</h3>`;
            }
        }
        
        testDetectionData();
    </script>
</body>
</html>
