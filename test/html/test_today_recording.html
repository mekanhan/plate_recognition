<!DOCTYPE html>
<html>
<head>
    <title>Test Today's Recording Playback</title>
</head>
<body>
    <h1>Test Today's Recording Playback</h1>
    <p>Camera: Reolink Main Entrance (e4036ff5-fd9a-431a-8583-3ec721f53f1a)</p>
    <video id="testVideo" controls width="800" height="600">
        <source src="http://localhost:8002/api/v1/recordings/stream/camera_e4036ff5-fd9a-431a-8583-3ec721f53f1a_20250803_130728.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    
    <div id="status"></div>
    
    <h2>Available Recordings Today:</h2>
    <div id="recordings"></div>
    
    <script>
        const video = document.getElementById('testVideo');
        const status = document.getElementById('status');
        
        video.addEventListener('loadstart', () => {
            status.innerHTML += '<p>✅ Load started</p>';
        });
        
        video.addEventListener('loadedmetadata', () => {
            status.innerHTML += '<p>✅ Metadata loaded</p>';
        });
        
        video.addEventListener('loadeddata', () => {
            status.innerHTML += '<p>✅ Data loaded</p>';
        });
        
        video.addEventListener('canplay', () => {
            status.innerHTML += '<p>✅ Can play</p>';
        });
        
        video.addEventListener('error', (e) => {
            status.innerHTML += '<p>❌ Error: ' + (video.error ? video.error.message : 'Unknown error') + '</p>';
            console.error('Video error:', e, video.error);
        });
        
        // Fetch today's timeline
        fetch('http://localhost:8002/api/v1/recordings/cameras/e4036ff5-fd9a-431a-8583-3ec721f53f1a/timeline?date=2025-08-03')
            .then(response => response.json())
            .then(data => {
                const recordingsDiv = document.getElementById('recordings');
                recordingsDiv.innerHTML = '<p>Total segments: ' + data.segment_count + '</p>';
                
                const list = document.createElement('ul');
                data.segments.slice(-5).forEach(segment => {
                    const li = document.createElement('li');
                    li.innerHTML = `<a href="#" onclick="playRecording('${segment.filename}'); return false;">${segment.filename}</a> (${segment.start_time} to ${segment.end_time})`;
                    list.appendChild(li);
                });
                recordingsDiv.appendChild(list);
            })
            .catch(err => {
                document.getElementById('recordings').innerHTML = '<p>❌ Failed to fetch recordings: ' + err.message + '</p>';
            });
        
        function playRecording(filename) {
            video.src = 'http://localhost:8002/api/v1/recordings/stream/' + filename;
            video.load();
            video.play();
        }
    </script>
</body>
</html>
