<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPR Security System - Dashboard</title>
    
    <!-- Main CSS -->
    <link rel="stylesheet" href="styles/main.css">
    
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Theme Detection -->
    <script>
        // Detect and apply theme preference
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>
<body>
    <!-- Application will be initialized here by app.js -->
    <div id="app-root">
        <!-- Loading indicator while app initializes -->
        <div class="loading-overlay" id="initial-loading" style="display: flex;">

                <i class="fas fa-spinner fa-spin"></i>
                <span>Initializing LPR System...</span>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Main Application Script -->
    <script type="module" src="app.js"></script>
    
    <!-- Demo Enhancement Script -->
    <script src="demo.js"></script>
